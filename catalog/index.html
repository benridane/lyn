<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LYN テーマカタログ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: 設計図をライトテーブルに並べる。画面の縮小図を主役に、説明は最小限 */
:root {
  --bg: #e9edf1;
  --surface: #ffffff;
  --well: #dfe4ea;
  --ink: #16202a;
  --muted: #5a6573;
  --line: #cfd6de;
  --accent: #2753b8;
  --accent-ink: #ffffff;
  --code-bg: #f4f6f8;
  --font-display: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", sans-serif;
  --font-body: "Noto Sans JP", "Hiragino Sans", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10151b; --surface: #19212a; --well: #0b0f14; --ink: #e5eaf0; --muted: #96a2af;
    --line: #2b3541; --accent: #85a5ff; --accent-ink: #0d1420; --code-bg: #121920; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10151b; --surface: #19212a; --well: #0b0f14; --ink: #e5eaf0; --muted: #96a2af;
  --line: #2b3541; --accent: #85a5ff; --accent-ink: #0d1420; --code-bg: #121920; color-scheme: dark;
}
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 40px 56px; }
header.top { display: grid; gap: 10px; margin-bottom: 28px; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(28px, 4vw, 40px); line-height: 1.2; margin: 0; text-wrap: balance; }
.lead { margin: 0; color: var(--muted); max-width: 62ch; }
.stats { display: flex; flex-wrap: wrap; gap: 6px 18px; font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.stats b { color: var(--ink); font-weight: 600; }

.filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 22px; }
.chip-btn {
  font: 500 13px/1 var(--font-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: 999px; padding: 8px 14px; cursor: pointer;
}
.chip-btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip-btn:focus-visible, .seg button:focus-visible, .btn:focus-visible, .card-link:focus-visible, .close:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 22px; }
.card { position: relative; display: grid; gap: 12px; }
.shot { position: relative; aspect-ratio: 4 / 3; max-width: 100%; overflow: hidden; background: #fff; border: 1px solid var(--line); border-radius: 6px; }
.shot iframe { position: absolute; top: 0; left: 0; border: 0; transform-origin: 0 0; pointer-events: none; background: #fff; }
.card:hover .shot { border-color: var(--accent); }
.meta { display: grid; gap: 6px; }
.meta-row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.name { font-family: var(--font-display); font-weight: 700; font-size: 18px; letter-spacing: .02em; }
.page-kind { font-size: 12.5px; color: var(--muted); margin-left: 8px; font-weight: 500; font-family: var(--font-body); letter-spacing: 0; }
.swatches { display: flex; gap: 4px; }
.sw { width: 14px; height: 14px; border-radius: 3px; border: 1px solid rgba(127,127,127,.35); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--well); color: var(--ink); }
.tag.none { color: var(--muted); background: transparent; border: 1px dashed var(--line); }
.size { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.card-link { position: absolute; inset: 0; border-radius: 6px; }
.card-link span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.empty { color: var(--muted); padding: 24px 0; }

footer.note { margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); display: grid; gap: 6px; max-width: 80ch; }
footer.note a { color: var(--accent); }

dialog {
  width: min(1240px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); padding: 0; border: 1px solid var(--line);
  border-radius: 10px; background: var(--surface); color: var(--ink); overflow: auto;
}
dialog::backdrop { background: rgba(10, 14, 20, .55); }
.d-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); z-index: 2; }
.d-title { font-family: var(--font-display); font-weight: 700; font-size: 20px; margin: 0; }
.close { font: 500 14px var(--font-body); background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
.d-body { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: 20px; padding: 20px; }
@media (max-width: 860px) { .d-body { grid-template-columns: minmax(0, 1fr); } }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { font: 500 13px var(--font-body); padding: 7px 12px; border: 0; background: var(--surface); color: var(--ink); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.stage { background: var(--well); border-radius: 8px; padding: 14px; overflow: hidden; }
.stage-frame { position: relative; margin: 0 auto; overflow: hidden; background: #fff; box-shadow: 0 1px 0 rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.12); }
.stage-frame iframe { position: absolute; top: 0; left: 0; border: 0; transform-origin: 0 0; background: #fff; }
.side { display: grid; gap: 16px; align-content: start; min-width: 0; }
.side h3 { font: 700 13px var(--font-body); margin: 0 0 6px; letter-spacing: .04em; color: var(--muted); }
textarea#src {
  width: 100%; min-height: 340px; box-sizing: border-box; resize: vertical; font: 12.5px/1.6 var(--font-mono);
  color: var(--ink); background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px; padding: 12px; tab-size: 2; white-space: pre; overflow: auto;
}
.row-btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
.btn { font: 500 13px var(--font-body); padding: 7px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.status { font-size: 12.5px; color: var(--muted); }
.unknowns { margin: 0; padding-left: 1.1em; font-size: 13.5px; }
.unknowns li + li { margin-top: 4px; }
.info { font-size: 13.5px; color: var(--muted); margin: 0; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="eyebrow">LYN v0.7 · Layout patterns</div>
    <h1>LYN テーマカタログ</h1>
    <p class="lead">テーマの構造をLYN（レイアウト記法）で書き、そこから自動で描いた見取り図です。画像は使っていません。カードを開くとLYNを編集でき、図がその場で描き直されます。</p>
    <div class="stats" id="stats"></div>
  </header>

  <div class="filters" id="filters" role="group" aria-label="特徴で絞り込む"></div>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>この特徴を持つレイアウトはまだありません。</p>

  <footer class="note">
    <div>寸法はLYNに書かれていないため、一般的な値で補って描いています。配色はどれも例です。</div>
    <div>LYNの仕様と、ここに載せたレイアウトのソースは、リポジトリの <code>LYN-spec.md</code> と <code>examples/</code> にあります。</div>
  </footer>
</div>

<dialog id="detail" aria-labelledby="d-title">
  <div class="d-head">
    <h2 class="d-title" id="d-title"></h2>
    <button class="close" id="close" type="button">閉じる</button>
  </div>
  <div class="d-body">
    <div>
      <div class="toolbar">
        <div class="seg" role="group" aria-label="表示する幅">
          <button type="button" id="w-pc" aria-pressed="true">PC 1280px</button>
          <button type="button" id="w-sp" aria-pressed="false">スマホ 390px</button>
        </div>
        <div class="seg" role="group" aria-label="要素名">
          <button type="button" id="names" aria-pressed="false">要素名を表示</button>
        </div>
      </div>
      <div class="stage" id="stage"><div class="stage-frame" id="stage-frame"></div></div>
    </div>
    <div class="side">
      <div>
        <h3>LYN</h3>
        <textarea id="src" spellcheck="false" aria-label="LYNのソース"></textarea>
        <div class="row-btns">
          <button class="btn primary" type="button" id="copy">コピー</button>
          <button class="btn" type="button" id="reset">元に戻す</button>
          <span class="status" id="status" aria-live="polite"></span>
        </div>
      </div>
      <div id="features-box"><h3>特徴</h3><div class="tags" id="d-features"></div></div>
      <div id="unknown-box"><h3>不明な点</h3><ul class="unknowns" id="d-unknowns"></ul></div>
      <p class="info" id="d-note"></p>
    </div>
  </div>
</dialog>

<script>
/* ---------- LYN パーサー ---------- */
function topIndex(str, test) {
  let q = false, p = 0, b = 0;
  for (let i = 0; i < str.length; i++) {
    const c = str[i];
    if (q) { if (c === '"') q = false; continue; }
    if (c === '"') { q = true; continue; }
    if (c === '(') p++; else if (c === ')') p--;
    else if (c === '[') b++; else if (c === ']') b--;
    else if (p === 0 && b === 0 && test(str, i)) return i;
  }
  return -1;
}
function splitTop(str, test) {
  const out = []; let rest = str, i;
  while ((i = topIndex(rest, test)) >= 0) { out.push(rest.slice(0, i)); rest = rest.slice(i + 1); }
  out.push(rest);
  return out;
}
const isComment = (s, i) => s[i] === '#' && (i === 0 || /\s/.test(s[i - 1]));
const isChain = (s, i) => s[i] === '>' && s[i - 1] === ' ' && s[i + 1] === ' ';
const isColon = (s, i) => s[i] === ':';
const isComma = (s, i) => s[i] === ',';

function takeOver(s) {
  const m = s.match(/@over\s+([\w-]+):(top|bottom|left|right)\s+(\d+(?:\.\d+)?)%/);
  if (!m) return { s, over: null };
  return { s: (s.slice(0, m.index) + s.slice(m.index + m[0].length)).trim(), over: { t: m[1], side: m[2], amt: +m[3] } };
}
function parseEl(str, over) {
  str = str.trim();
  const m = str.match(/^([\w-]+)(?:\*(\d+|n))?/);
  if (!m) return null;
  const rep = m[2] === 'n' ? 3 : (m[2] ? Math.min(+m[2], 24) : 1);
  let rest = str.slice(m[0].length).trim(), cls = [];
  if (rest.startsWith('(')) {
    let d = 0, j = 0;
    for (; j < rest.length; j++) { if (rest[j] === '(') d++; else if (rest[j] === ')') { d--; if (d === 0) break; } }
    cls = rest.slice(1, j).trim().split(/\s+/).filter(Boolean);
    rest = rest.slice(j + 1).trim();
  }
  const texts = [...rest.matchAll(/"([^"]*)"/g)].map(x => x[1]);
  return { name: m[1], rep, cls, texts, over, kids: [] };
}
function parseSpec(str) {
  const parts = splitTop(str, isChain).map(s => s.trim()).filter(Boolean);
  let head = null, tail = null;
  for (const raw of parts) {
    const { s, over } = takeOver(raw);
    const ci = topIndex(s, isColon);
    const el = parseEl(ci >= 0 ? s.slice(0, ci) : s, over);
    if (!el) continue;
    if (ci >= 0) {

    <div class="meta">
      <div class="meta-row"><div class="name">${esc(t.name)}<span class="page-kind">${esc(t.page)}</span></div><div class="swatches">${sw}</div></div>
      <div class="meta-row"><div class="tags">${tags}</div><div class="size">LYN ${fmt(t.src.length)}字</div></div>
    </div>
    <a class="card-link" href="#${t.id}"><span>${esc(t.name)} ${esc(t.page)} を開く</span></a>`;
  const f = document.createElement('iframe');
  f.setAttribute('sandbox', 'allow-scripts');
  f.setAttribute('tabindex', '-1');
  f.setAttribute('aria-hidden', 'true');
  f.title = `${t.name} ${t.page} の見取り図`;
  f.width = 1280; f.height = 960;
  f.srcdoc = frameDoc(t.src, { vh: 960 });
  const shot = el.querySelector('.shot');
  shot.appendChild(f);
  thumbObserver.observe(shot);
  return el;
}

let filter = 'すべて';
function drawFilters() {
  const box = document.getElementById('filters');
  box.innerHTML = '';
  for (const f of ['すべて', ...ALL_FEATURES]) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip-btn'; b.textContent = f;
    b.setAttribute('aria-pressed', String(f === filter));
    b.addEventListener('click', () => { filter = f; drawFilters(); applyFilter(); });
    box.appendChild(b);
  }
}
function applyFilter() {
  let shown = 0;
  for (const el of grid.children) {
    const ok = filter === 'すべて' || el.dataset.features.split(',').includes(filter);
    el.hidden = !ok; if (ok) shown++;
  }
  document.getElementById('empty').hidden = shown > 0;
}

/* ---------- 詳細 ---------- */
const dlg = document.getElementById('detail');
const srcBox = document.getElementById('src');
const stageFrame = document.getElementById('stage-frame');
const stage = document.getElementById('stage');
let current = null, width = 1280, names = false, frameH = 960, live = null, timer = 0;

function fit() {
  if (!live) return;
  const avail = stage.clientWidth - 28;
  const s = Math.min(1, avail / width);
  live.style.transform = `scale(${s})`;
  live.style.width = width + 'px';
  live.style.height = frameH + 'px';
  stageFrame.style.width = Math.round(width * s) + 'px';
  stageFrame.style.height = Math.round(frameH * s) + 'px';
}
function drawDetail() {
  const vh = width === 1280 ? 960 : 844;
  frameH = vh;
  const f = document.createElement('iframe');
  f.setAttribute('sandbox', 'allow-scripts');
  f.title = '見取り図の拡大';
  f.srcdoc = frameDoc(srcBox.value, { vh, names });
  stageFrame.replaceChildren(f);
  live = f;
  fit();
  const ast = parseLyn(srcBox.value);
  const ul = document.getElementById('d-unknowns');
  ul.innerHTML = ast.meta.unknown.map(u => `<li>${esc(u)}</li>`).join('');
  document.getElementById('unknown-box').hidden = !ast.meta.unknown.length;
}
window.addEventListener('message', e => {
  if (live && e.source === live.contentWindow && e.data && e.data.lyn === 'h') {
    frameH = Math.max(e.data.h, 200);
    fit();
  }
});
new ResizeObserver(fit).observe(stage);

function open(id) {
  const t = THEMES.find(x => x.id === id);
  if (!t) return;
  current = t;
  document.getElementById('d-title').textContent = `${t.name} · ${t.page}`;
  document.getElementById('d-features').innerHTML = t.features.length ? t.features.map(f => `<span class="tag">${esc(f)}</span>`).join('') : '<span class="tag none">なし</span>';
  document.getElementById('d-note').textContent = t.note || '';
  srcBox.value = t.src;
  document.getElementById('status').textContent = '';
  if (!dlg.open) dlg.showModal();
  drawDetail();
}
function closeDetail() {
  if (dlg.open) dlg.close();
}
dlg.addEventListener('close', () => {
  if (dlg.open) return;
  live = null; stageFrame.replaceChildren();
  if (location.hash) history.replaceState(null, '', location.pathname + location.search);
});
document.getElementById('close').addEventListener('click', closeDetail);
dlg.addEventListener('click', e => { if (e.target === dlg) closeDetail(); });

function setWidth(w) {
  width = w;
  document.getElementById('w-pc').setAttribute('aria-pressed', String(w === 1280));
  document.getElementById('w-sp').setAttribute('aria-pressed', String(w === 390));
  drawDetail();
}
document.getElementById('w-pc').addEventListener('click', () => setWidth(1280));
document.getElementById('w-sp').addEventListener('click', () => setWidth(390));
document.getElementById('names').addEventListener('click', e => {
  names = !names; e.currentTarget.setAttribute('aria-pressed', String(names)); drawDetail();
});
srcBox.addEventListener('input', () => {
  clearTimeout(timer);
  document.getElementById('status').textContent = '描き直し中…';
  timer = setTimeout(() => { drawDetail(); document.getElementById('status').textContent = `${fmt(srcBox.value.length)}字`; }, 450);
});
document.getElementById('reset').addEventListener('click', () => {
  if (!current) return;
  srcBox.value = current.src; drawDetail();
  document.getElementById('status').textContent = '元のLYNに戻しました';
});
document.getElementById('copy').addEventListener('click', () => {
  const done = () => { document.getElementById('status').textContent = 'コピーしました'; };
  try {
    navigator.clipboard.writeText(srcBox.value).then(done, () => { srcBox.select(); document.getElementById('status').textContent = '選択しました。コピーしてください'; });
  } catch (err) { srcBox.select(); document.getElementById('status').textContent = '選択しました。コピーしてください'; }
});

function route() {
  const id = location.hash.slice(1);
  if (THEMES.some(t => t.id === id)) open(id); else closeDetail();
}
window.addEventListener('hashchange', route);

stats();
drawFilters();
for (const t of THEMES) grid.appendChild(card(t));
applyFilter();
route();
</script>

</body>
</html>
